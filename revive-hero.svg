<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="dead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="960" y="120" text-anchor="middle" font-family="monospace" font-size="64" font-weight="bold" fill="#e0e0e0">revive</text>
  <text x="960" y="175" text-anchor="middle" font-family="monospace" font-size="28" fill="#aaa">your VSTi UI: dead. this: not dead.</text>

  <!-- Left: dead plugin window (blank white) -->
  <g>
    <rect x="180" y="260" width="640" height="480" rx="16" fill="#fff" stroke="#666" stroke-width="4"/>
    <rect x="180" y="260" width="640" height="56" rx="16" fill="#444"/>
    <circle cx="212" cy="288" r="9" fill="#ff5f57"/>
    <circle cx="240" cy="288" r="9" fill="#febc2e"/>
    <circle cx="268" cy="288" r="9" fill="#28c840"/>
    <text x="500" y="300" text-anchor="middle" font-family="monospace" font-size="22" fill="#ccc">ShaperBox 3</text>
    <text x="500" y="520" text-anchor="middle" font-family="monospace" font-size="48" fill="#bbb">⬜</text>
    <text x="500" y="580" text-anchor="middle" font-family="monospace" font-size="26" fill="#999">blank. forever.</text>
    <text x="500" y="700" text-anchor="middle" font-family="monospace" font-size="20" fill="#777">"could not send message" x139</text>
  </g>

  <!-- Arrow -->
  <g filter="url(#glow)">
    <text x="960" y="520" text-anchor="middle" font-family="monospace" font-size="72" fill="#00ff88">→</text>
    <text x="960" y="450" text-anchor="middle" font-family="monospace" font-size="22" fill="#00ff88">kill Index.exe</text>
  </g>

  <!-- Right: revived plugin window -->
  <g>
    <rect x="1100" y="260" width="640" height="480" rx="16" fill="url(#live)" stroke="#00d4ff" stroke-width="4"/>
    <rect x="1100" y="260" width="640" height="56" rx="16" fill="#004466"/>
    <circle x="1132" cy="288" r="9" fill="#ff5f57"/>
    <circle x="1160" cy="288" r="9" fill="#febc2e"/>
    <circle x="1188" cy="288" r="9" fill="#28c840"/>
    <text x="1420" y="300" text-anchor="middle" font-family="monospace" font-size="22" fill="#9de8ff">ShaperBox 3</text>
    <!-- fake knobs -->
    <circle cx="1260" cy="420" r="60" fill="#01618a" stroke="#9de8ff" stroke-width="4"/>
    <line x1="1260" y1="420" x2="1290" y2="380" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1460" cy="420" r="60" fill="#01618a" stroke="#9de8ff" stroke-width="4"/>
    <line x1="1460" y1="420" x2="1430" y2="380" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <rect x="1240" y="560" width="360" height="16" rx="8" fill="#01618a"/>
    <rect x="1240" y="560" width="180" height="16" rx="8" fill="#9de8ff"/>
    <text x="1420" y="680" text-anchor="middle" font-family="monospace" font-size="26" fill="#01293d">controls: usable</text>
  </g>

  <!-- Footer -->
  <text x="960" y="960" text-anchor="middle" font-family="monospace" font-size="22" fill="#777">revive · the watchdog Ableton didn't write · bun bin/revive.ts run</text>
</svg>